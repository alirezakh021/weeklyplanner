<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>برنامه‌ریز هفتگی</title>
<meta name="theme-color" content="#1F5E52">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=Lalezar&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1EEE4;
    --paper-2:#E9E4D6;
    --surface:#FFFFFF;
    --ink:#20261F;
    --muted:#8B8878;
    --border:#DFDACB;
    --fixed:#1F5E52;
    --fixed-soft:#DEEEE9;
    --variable:#C77B2E;
    --variable-soft:#F7E9D6;
    --done:#3F7D63;
    --danger:#B4483A;
    --gold:#D99A2B;
    --blob1: rgba(31,94,82,0.11);
    --blob2: rgba(199,123,46,0.12);
    --radius:18px;
    --shadow-sm:0 2px 8px -2px rgba(32,38,31,.12);
    --shadow-md:0 14px 30px -12px rgba(32,38,31,.30);
  }
  html[data-theme="dark"]{
    --paper:#181C17;
    --paper-2:#1F241D;
    --surface:#20261F;
    --ink:#EDEAE0;
    --muted:#8F9589;
    --border:#333A30;
    --fixed:#45B79A;
    --fixed-soft:#1D3129;
    --variable:#E29A54;
    --variable-soft:#3A2A19;
    --done:#4FBF98;
    --danger:#E0776A;
    --gold:#F0BE55;
    --blob1: rgba(69,183,154,0.14);
    --blob2: rgba(226,154,84,0.12);
    --shadow-sm:0 2px 10px -2px rgba(0,0,0,.55);
    --shadow-md:0 16px 34px -14px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Vazirmatn', Tahoma, sans-serif;
    min-height:100vh; display:flex; justify-content:center;
    transition:background .3s ease, color .3s ease;
  }
  .bg-blob{position:fixed; width:62vw; height:62vw; max-width:440px; max-height:440px; border-radius:50%;
    filter:blur(64px); z-index:0; pointer-events:none; transition:background .3s ease; will-change:transform;}
  .blob1{top:-8%; right:-12%; background:var(--blob1);}
  .blob2{bottom:6%; left:-16%; background:var(--blob2);}

  .app{width:100%; max-width:480px; min-height:100vh; display:flex; flex-direction:column;
    padding:20px 14px 110px; position:relative; z-index:1; animation:appIn .35s ease;}
  @keyframes appIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  header{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:14px; gap:8px;}
  .title-block h1{
    font-family:'Lalezar','Vazirmatn',Tahoma,sans-serif; font-weight:400;
    font-size:27px; margin:0 0 2px; letter-spacing:.2px;
    background:linear-gradient(90deg, var(--ink), var(--fixed) 140%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .title-block p{margin:0; font-size:12.5px; color:var(--muted); font-weight:600; letter-spacing:.2px;}
  .header-actions{display:flex; gap:6px;}
  .icon-btn{
    width:37px;height:37px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); display:flex;align-items:center;justify-content:center;
    cursor:pointer; color:var(--ink); transition:transform .15s ease, box-shadow .15s ease;
    position:relative; box-shadow:var(--shadow-sm);
  }
  .icon-btn:active{transform:scale(0.9);}
  .icon-btn:focus-visible{outline:2px solid var(--fixed); outline-offset:2px;}

  .streak-pill{
    display:flex; align-items:center; gap:6px;
    background:linear-gradient(135deg, color-mix(in srgb, var(--gold) 12%, var(--surface)), var(--surface));
    border:1px solid var(--border); box-shadow:var(--shadow-sm);
    border-radius:99px; padding:7px 14px; margin-bottom:12px; width:fit-content;
    font-size:12.5px; font-weight:700; color:var(--gold);
  }

  .week-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .week-nav .range{font-size:13px; font-weight:600; color:var(--muted);}
  .nav-arrows{display:flex; gap:6px;}
  .nav-arrows button{
    width:30px;height:30px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface); cursor:pointer; display:flex;align-items:center;justify-content:center; color:var(--ink);
  }
  .nav-arrows button:active{background:var(--fixed-soft);}
  .today-btn{width:auto !important; border-radius:99px; padding:0 14px; font-size:12px; font-weight:700;}

  .day-strip{display:flex; gap:7px; overflow-x:auto; padding:6px 3px 16px; scroll-snap-type:x proximity;}
  .day-strip::-webkit-scrollbar{display:none;}
  .day-tab{
    flex:0 0 auto; width:54px; padding:11px 0 9px;
    clip-path: polygon(0 0, 100% 0, 100% 82%, 50% 100%, 0 82%);
    background:var(--surface); border:1px solid var(--border); border-bottom:none;
    display:flex;flex-direction:column;align-items:center;gap:5px; cursor:pointer;
    position:relative; scroll-snap-align:center; transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
    box-shadow:var(--shadow-sm);
  }
  .day-tab .wd{font-size:11px; font-weight:700; color:var(--muted);}
  .day-tab .num{font-size:15.5px; font-weight:800; font-variant-numeric:tabular-nums;}
  .day-tab .dot{width:5px;height:5px;border-radius:50%;background:var(--variable); opacity:.6;}
  .day-tab.is-fixed .dot{background:var(--fixed); opacity:.85;}
  .day-tab.is-today{border-color:var(--ink); border-width:1.5px;}
  .day-tab.is-active{background:linear-gradient(160deg, var(--ink), color-mix(in srgb, var(--ink) 80%, var(--fixed)));
    transform:translateY(-6px); box-shadow:var(--shadow-md);}
  .day-tab.is-active .wd, .day-tab.is-active .num{color:var(--paper);}
  .day-tab.is-active .dot{background:var(--gold); opacity:1;}
  .day-tab .bar{width:26px;height:3px;border-radius:2px;background:var(--border);overflow:hidden;margin-top:2px;}
  .day-tab .bar i{display:block;height:100%;background:var(--fixed);border-radius:2px;}
  .day-tab.is-active .bar{background:rgba(255,255,255,.18);}
  .day-tab.is-active .bar i{background:var(--gold);}

  .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 16px 14px; flex:1; box-shadow:var(--shadow-md);}
  .panel-head{display:flex;align-items:center;justify-content:space-between; margin-bottom:14px;}
  .panel-head .day-name{font-size:17px; font-weight:800; letter-spacing:-.2px;}
  .chip{font-size:11px; font-weight:700; padding:5px 12px; border-radius:99px;}
  .chip.fixed{background:var(--fixed-soft); color:var(--fixed);}
  .chip.variable{background:var(--variable-soft); color:var(--variable);}

  .progress-row{display:flex;align-items:center;gap:8px; margin-bottom:6px;}
  .progress-track{flex:1;height:6px;border-radius:4px;background:var(--paper);overflow:hidden;}
  .progress-track i{display:block;height:100%;background:var(--done);border-radius:4px;transition:width .25s ease;}
  .progress-label{font-size:11.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .estimate-label{font-size:11px; color:var(--muted); font-weight:600; margin-bottom:12px;}

  .copy-yesterday{
    display:flex; align-items:center; justify-content:center; gap:6px;
    background:var(--variable-soft); color:var(--variable); border:none;
    border-radius:12px; padding:10px; font-size:12.5px; font-weight:700;
    width:100%; margin-bottom:12px; cursor:pointer; font-family:inherit;
  }

  .items{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .item{display:flex;align-items:flex-start;gap:8px; padding:10px 10px; background:var(--paper); border-radius:13px; border-right:3px solid transparent; transition:opacity .2s ease, background .2s ease;}
  .item.priority{border-right-color:var(--gold); background:linear-gradient(90deg, color-mix(in srgb, var(--gold) 10%, var(--paper)), var(--paper) 45%);}
  .item.done{opacity:.5;}
  .reorder-col{display:flex;flex-direction:column;gap:2px; padding-top:2px;}
  .reorder-col button{
    width:18px;height:16px;border:none;background:transparent;color:var(--muted);cursor:pointer;
    display:flex;align-items:center;justify-content:center; padding:0;
  }
  .reorder-col button:disabled{opacity:.2; cursor:default;}
  .checkbox{
    width:22px;height:22px; border-radius:7px; border:2px solid var(--border); flex:0 0 auto; margin-top:2px;
    cursor:pointer; display:flex;align-items:center;justify-content:center; background:var(--surface);
    transition:background .15s ease, border-color .15s ease;
  }
  .checkbox.checked{background:var(--done); border-color:var(--done);}
  .checkbox svg{width:13px;height:13px; opacity:0; transition:opacity .1s ease;}
  .checkbox.checked svg{opacity:1;}
  .item-main{flex:1; display:flex; flex-direction:column; gap:4px; min-width:0;}
  .item-text{
    font-size:14.5px; font-weight:500; background:transparent; border:none; outline:none;
    color:var(--ink); padding:2px 0; width:100%;
  }
  .item.done .item-text{text-decoration:line-through; color:var(--muted);}
  .item-meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .item-time, .item-duration{
    border:none; background:transparent; color:var(--muted); font-size:11.5px; font-weight:600;
    font-family:inherit; padding:0;
  }
  .item-time{width:62px;}
  .item-duration{width:52px;}
  .tag-dot{width:14px;height:14px;border-radius:50%; border:1.5px solid var(--border); cursor:pointer; flex:0 0 auto;}
  .item-actions{display:flex; align-items:center; gap:2px; flex:0 0 auto;}
  .star-btn, .item-del{
    width:26px;height:26px; border-radius:8px; border:none; background:transparent; color:var(--muted);
    cursor:pointer; display:flex;align-items:center;justify-content:center; flex:0 0 auto;
  }
  .star-btn.active{color:var(--gold);}
  .item-del:active{background:color-mix(in srgb, var(--danger) 15%, var(--paper)); color:var(--danger);}

  .day-note{
    width:100%; border:1px dashed var(--border); border-radius:12px; background:var(--paper);
    padding:10px 12px; font-family:inherit; font-size:12.5px; color:var(--ink); resize:none;
    outline:none; margin-bottom:12px; min-height:44px;
  }
  .day-note:focus{border-color:var(--fixed);}

  .focus-btn{
    display:flex; align-items:center; justify-content:center; gap:6px; width:100%;
    background:var(--fixed-soft); color:var(--fixed); border:none; border-radius:12px;
    padding:10px; font-size:12.5px; font-weight:700; margin-bottom:12px; cursor:pointer; font-family:inherit;
  }

  .empty-state{text-align:center; padding:22px 10px 14px; color:var(--muted);}
  .empty-state p{margin:0 0 2px; font-size:13.5px; font-weight:600;}
  .empty-state span{font-size:12px;}

  .add-row{display:flex;gap:8px; border-top:1px dashed var(--border); padding-top:12px;}
  .add-row input{
    flex:1; border:1px solid var(--border); border-radius:12px; padding:11px 12px;
    font-family:inherit; font-size:13.5px; background:var(--paper); outline:none; color:var(--ink);
  }
  .add-row input:focus{border-color:var(--fixed);}
  .add-row button{
    width:42px;height:42px; border-radius:12px; border:none; background:var(--ink); color:var(--paper);
    cursor:pointer; display:flex;align-items:center;justify-content:center; flex:0 0 auto;
  }
  .add-row button:active{transform:scale(.94);}

  .fab{
    position:fixed; bottom:22px; left:calc(50% + 190px);
    width:56px; height:56px; border-radius:50%; border:none; cursor:pointer; z-index:40;
    background:linear-gradient(150deg, var(--fixed), color-mix(in srgb, var(--fixed) 70%, black));
    color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-md);
    transition:transform .12s ease;
  }
  .fab:active{transform:scale(.92);}
  @media (max-width:480px){ .fab{ left:auto; right:20px; } }

  .overlay{position:fixed; inset:0; background:rgba(10,10,8,.5); display:flex; align-items:flex-end; justify-content:center; z-index:50; animation:fade .15s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .modal{width:100%; max-width:480px; background:var(--surface); border-radius:24px 24px 0 0; padding:14px 18px 26px; max-height:88vh; overflow-y:auto; box-shadow:0 -12px 30px -10px rgba(0,0,0,.4);}
  .modal::before{content:''; display:block; width:38px; height:4px; border-radius:99px; background:var(--border); margin:0 auto 16px;}
  .modal h2{font-size:17.5px; font-weight:800; margin:0 0 4px;}
  .modal .sub{font-size:12.5px; color:var(--muted); margin:0 0 16px; font-weight:500; line-height:1.7;}
  .weekday-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:18px;}
  .weekday-pill{
    padding:11px 4px; text-align:center; border-radius:12px; border:1.5px solid var(--border);
    font-size:12.5px;font-weight:700; cursor:pointer; color:var(--muted); background:var(--paper);
  }
  .weekday-pill.selected{border-color:var(--fixed); background:var(--fixed-soft); color:var(--fixed);}
  .template-block{border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:12px;}
  .template-block .tb-title{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--fixed);}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .btn{flex:1; padding:13px; border-radius:13px; border:none; font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer; transition:transform .12s ease;}
  .btn.primary{background:linear-gradient(135deg, var(--ink), color-mix(in srgb, var(--ink) 80%, var(--fixed))); color:var(--paper); box-shadow:var(--shadow-sm);}
  .btn.ghost{background:var(--paper); color:var(--ink); border:1px solid var(--border);}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.4;}

  .section-title{font-size:13.5px; font-weight:800; margin:18px 0 10px; color:var(--ink);}
  .notif-row{display:flex; align-items:center; justify-content:space-between; border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:12px;}
  .notif-row span{font-size:12.5px; font-weight:600;}
  .notif-status{font-size:11px; font-weight:700; color:var(--muted);}
  .notif-status.on{color:var(--fixed);}

  .row-actions{display:flex; gap:8px;}
  .small-input{border:1px solid var(--border); border-radius:10px; padding:8px 10px; font-family:inherit; font-size:12.5px; background:var(--paper); color:var(--ink); outline:none;}

  .tabs{display:flex; gap:6px; overflow-x:auto; margin-bottom:16px; padding-bottom:2px;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{flex:0 0 auto; padding:8px 13px; border-radius:99px; border:1px solid var(--border); background:var(--paper); color:var(--muted); font-size:12px; font-weight:700; cursor:pointer;}
  .tab-btn.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  .heatmap-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:6px;}
  .heat-cell{aspect-ratio:1; border-radius:6px; background:var(--paper);}
  .heat-labels{display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-bottom:10px;}

  .summary-row{margin-bottom:16px;}
  .summary-row .sr-head{display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; margin-bottom:6px;}
  .summary-track{height:10px; border-radius:6px; background:var(--paper); overflow:hidden;}
  .summary-track i{display:block; height:100%; border-radius:6px;}

  .insight-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .insight-row .wd-label{width:60px; font-size:12px; font-weight:700; color:var(--muted); flex:0 0 auto;}
  .insight-row .track{flex:1; height:10px; border-radius:6px; background:var(--paper); overflow:hidden;}
  .insight-row .track i{display:block; height:100%; border-radius:6px; background:var(--fixed);}
  .insight-row .val{width:36px; text-align:left; font-size:11.5px; font-weight:700; color:var(--muted); flex:0 0 auto;}

  .history-list{display:flex; flex-direction:column; gap:8px;}
  .history-item{display:flex; align-items:center; justify-content:space-between; padding:11px 12px; background:var(--paper); border-radius:12px; cursor:pointer;}
  .history-item .h-date{font-size:12.5px; font-weight:700;}
  .history-item .h-stat{font-size:11.5px; font-weight:700; color:var(--muted);}

  .search-input-row{display:flex; gap:8px; margin-bottom:14px;}
  .search-input-row input{flex:1; border:1px solid var(--border); border-radius:12px; padding:11px 12px; font-family:inherit; font-size:13.5px; background:var(--paper); outline:none; color:var(--ink);}
  .search-result{display:flex; align-items:center; justify-content:space-between; padding:11px 12px; background:var(--paper); border-radius:12px; margin-bottom:8px; cursor:pointer;}
  .search-result .sr-text{font-size:13px; font-weight:600;}
  .search-result .sr-date{font-size:11px; color:var(--muted); font-weight:600;}

  .focus-overlay{position:fixed; inset:0; background:var(--ink); z-index:60; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; color:var(--paper); text-align:center;}
  .focus-overlay .fo-progress{font-size:12px; opacity:.6; margin-bottom:10px; font-weight:700;}
  .focus-overlay .fo-text{font-size:24px; font-weight:800; margin-bottom:34px; line-height:1.5;}
  .focus-overlay .fo-actions{display:flex; gap:12px; width:100%; max-width:320px;}
  .focus-overlay button{flex:1; padding:15px; border-radius:14px; border:none; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;}
  .fo-done{background:var(--done); color:#fff;}
  .fo-skip{background:rgba(255,255,255,.12); color:var(--paper);}
  .fo-close{position:absolute; top:22px; left:22px; width:38px;height:38px; border-radius:50%; background:rgba(255,255,255,.12); color:var(--paper); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .fo-empty{font-size:16px; font-weight:700; opacity:.85;}

  .confetti-piece{position:fixed; top:-10px; width:8px;height:14px; border-radius:2px; z-index:80; pointer-events:none;}
  @keyframes confetti-fall{ to{ transform: translateY(105vh) rotate(540deg); opacity:0; } }
</style>
</head>
<body>
<div class="bg-blob blob1" id="blob1"></div>
<div class="bg-blob blob2" id="blob2"></div>
<div class="app" id="app"></div>

<script>
/* ---------------- API ---------------- */
const api = {
  getSettings: () => fetch('/api/settings').then(r=>r.json()),
  putSettings: (s) => fetch('/api/settings', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(s)}).then(r=>r.json()),
  getDays: (start,end) => fetch(`/api/days?start=${start}&end=${end}`).then(r=>r.json()),
  putDay: (iso, data) => fetch(`/api/day/${iso}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)}).then(r=>r.json()),
  search: (q) => fetch(`/api/search?q=${encodeURIComponent(q)}`).then(r=>r.json()),
  exportData: () => fetch('/api/export').then(r=>r.json()),
  importData: (data) => fetch('/api/import', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)}).then(r=>r.json()),
};

const WEEKDAYS = ["شنبه","یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنج‌شنبه","جمعه"];
const WEEKDAYS_SHORT = ["ش","ی","د","س","چ","پ","ج"];
const TAGS = [
  {key:null, label:'بدون برچسب', color:'transparent'},
  {key:'work', label:'کار', color:'#3B6EA5'},
  {key:'health', label:'سلامتی', color:'#3F7D63'},
  {key:'personal', label:'شخصی', color:'#C77B2E'},
  {key:'study', label:'درس', color:'#8B5FBF'},
];

let state = {
  settings: null,
  weekOffset: 0,
  activeDate: null,
  cache: {},
  loadedMin: null,
  loadedMax: null,
  loaded: false,
  notifiedToday: new Set(),
  focusQueue: null,
  focusIdx: 0,
};

function pad(n){ return String(n).padStart(2,'0'); }
function toISO(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function addDays(d, n){ const c = new Date(d); c.setDate(c.getDate()+n); return c; }
function startOfToday(){ const t = new Date(); t.setHours(0,0,0,0); return t; }
function getWeekStart(baseDate, offset){
  const d = new Date(baseDate); d.setDate(d.getDate()+offset*7);
  const sinceSat = (d.getDay()+1)%7;
  d.setDate(d.getDate()-sinceSat); d.setHours(0,0,0,0);
  return d;
}
function jsDowToPersianIndex(jsDow){ return (jsDow+1)%7; }
function uid(){ return Math.random().toString(36).slice(2,9); }
function escapeAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function tagOf(key){ return TAGS.find(t=>t.key===key) || TAGS[0]; }

/* ---------------- theme + parallax ---------------- */
function initTheme(){
  const saved = localStorage.getItem('planner-theme');
  if(saved === 'dark') document.documentElement.setAttribute('data-theme','dark');
}
function toggleTheme(){
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  if(isDark){ document.documentElement.removeAttribute('data-theme'); localStorage.setItem('planner-theme','light'); }
  else { document.documentElement.setAttribute('data-theme','dark'); localStorage.setItem('planner-theme','dark'); }
  render();
}
function initParallax(){
  let ticking=false;
  function apply(){
    const y = window.scrollY || 0;
    const b1 = document.getElementById('blob1'), b2 = document.getElementById('blob2');
    if(b1) b1.style.transform = `translateY(${y*0.22}px) scale(${1+Math.min(y*0.0006,0.3)})`;
    if(b2) b2.style.transform = `translateY(${-y*0.16}px) scale(${1+Math.min(y*0.0004,0.25)})`;
    ticking=false;
  }
  window.addEventListener('scroll', ()=>{ if(!ticking){ requestAnimationFrame(apply); ticking=true; } }, {passive:true});
  apply();
}
function registerSW(){
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=> navigator.serviceWorker.register('/sw.js').catch(()=>{}));
  }
}

/* ---------------- init ---------------- */
async function init(){
  initTheme();
  initParallax();
  registerSW();
  state.settings = await api.getSettings();
  const today = startOfToday();
  state.activeDate = toISO(today);
  state.loaded = true;
  if(!state.settings){ render(); return; }
  await loadRangeForWeek(0);
  render();
  setInterval(checkNotifications, 20000);
}

async function loadRangeForWeek(offset){
  const today = startOfToday();
  const ws = getWeekStart(today, offset);
  const we = addDays(ws,6);
  const streakStart = addDays(today,-90);
  const minD = ws < streakStart ? ws : streakStart;
  const maxD = we > today ? we : today;
  const curMin = state.loadedMin ? new Date(state.loadedMin+'T00:00:00') : null;
  const curMax = state.loadedMax ? new Date(state.loadedMax+'T00:00:00') : null;
  const needMin = !curMin || minD < curMin;
  const needMax = !curMax || maxD > curMax;
  if(needMin || needMax){
    const fetchMin = needMin ? minD : curMin;
    const fetchMax = needMax ? maxD : curMax;
    const data = await api.getDays(toISO(fetchMin), toISO(fetchMax));
    Object.assign(state.cache, data);
    state.loadedMin = toISO(!curMin || minD<curMin ? minD : curMin);
    state.loadedMax = toISO(!curMax || maxD>curMax ? maxD : curMax);
  }
}
async function ensureRangeCovered(startD, endD){
  const needMin = !state.loadedMin || startD < new Date(state.loadedMin+'T00:00:00');
  const needMax = !state.loadedMax || endD > new Date(state.loadedMax+'T00:00:00');
  if(needMin || needMax){
    const data = await api.getDays(toISO(startD), toISO(endD));
    Object.assign(state.cache, data);
    if(needMin) state.loadedMin = toISO(startD < new Date(state.loadedMin+'T00:00:00') ? startD : new Date(state.loadedMin+'T00:00:00'));
    if(needMax) state.loadedMax = toISO(endD > new Date(state.loadedMax+'T00:00:00') ? endD : new Date(state.loadedMax+'T00:00:00'));
  }
}
async function ensureDayLoaded(iso){
  if(state.cache[iso]) return;
  const data = await api.getDays(iso, iso);
  Object.assign(state.cache, data);
}
async function saveDay(iso){ await api.putDay(iso, state.cache[iso]); }

/* ---------------- feedback ---------------- */
function hapticTick(){ if(navigator.vibrate) navigator.vibrate(12); }
function playBlip(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.06, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.18);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.18);
  }catch(e){}
}

/* ---------------- actions ---------------- */
async function selectDay(iso){ state.activeDate = iso; await ensureDayLoaded(iso); render(); }

async function toggleItem(iso, id){
  const day = state.cache[iso];
  const it = day.items.find(x=>x.id===id);
  if(!it) return;
  const wasComplete = day.items.length>0 && day.items.every(i=>i.done);
  it.done = !it.done;
  hapticTick(); playBlip();
  await saveDay(iso);
  const nowComplete = day.items.length>0 && day.items.every(i=>i.done);
  render();
  if(!wasComplete && nowComplete) celebrate();
}
async function deleteItem(iso,id){ state.cache[iso].items = state.cache[iso].items.filter(x=>x.id!==id); await saveDay(iso); render(); }
async function editItemText(iso,id,text){ const it=state.cache[iso].items.find(x=>x.id===id); if(it){ it.text=text; await saveDay(iso); } }
async function editItemTime(iso,id,time){ const it=state.cache[iso].items.find(x=>x.id===id); if(it){ it.time=time; await saveDay(iso); render(); } }
async function editItemDuration(iso,id,val){ const it=state.cache[iso].items.find(x=>x.id===id); if(it){ it.duration = val? parseInt(val,10) : null; await saveDay(iso); render(); } }
async function togglePriority(iso,id){ const it=state.cache[iso].items.find(x=>x.id===id); if(it){ it.priority=!it.priority; await saveDay(iso); render(); } }
async function cycleTag(iso,id){
  const it = state.cache[iso].items.find(x=>x.id===id); if(!it) return;
  const idx = TAGS.findIndex(t=>t.key===(it.tag||null));
  it.tag = TAGS[(idx+1)%TAGS.length].key;
  await saveDay(iso); render();
}
async function moveItem(iso,id,dir){
  const items = state.cache[iso].items;
  const idx = items.findIndex(x=>x.id===id);
  const sw = idx+dir; if(sw<0||sw>=items.length) return;
  [items[idx],items[sw]]=[items[sw],items[idx]];
  await saveDay(iso); render();
}
async function addItem(iso, text){
  if(!text.trim()) return;
  state.cache[iso].items.push({id:uid(), text:text.trim(), done:false, priority:false, time:'', tag:null, duration:null});
  await saveDay(iso); render();
}
async function editNote(iso, note){ state.cache[iso].note = note; await saveDay(iso); }
async function copyYesterday(iso){
  const y = toISO(addDays(new Date(iso+'T00:00:00'),-1));
  await ensureDayLoaded(y);
  const src = state.cache[y];
  if(!src || src.items.length===0) return;
  state.cache[iso].items = src.items.map(it=>({id:uid(), text:it.text, done:false, priority:it.priority, time:it.time, tag:it.tag||null, duration:it.duration||null}));
  await saveDay(iso); render();
}

/* ---------------- streak / stats ---------------- */
function computeStreak(){
  const todayISO = toISO(startOfToday());
  let cursor = new Date(todayISO+'T00:00:00');
  const todayData = state.cache[todayISO];
  const todayComplete = todayData && todayData.items.length>0 && todayData.items.every(i=>i.done);
  if(!todayComplete) cursor = addDays(cursor,-1);
  let streak=0, guard=0;
  while(guard<120){
    const iso = toISO(cursor);
    const d = state.cache[iso];
    if(!d) break;
    if(d.items.length===0){ cursor=addDays(cursor,-1); guard++; continue; }
    if(d.items.every(i=>i.done)){ streak++; cursor=addDays(cursor,-1); } else break;
    guard++;
  }
  return streak;
}
function celebrate(){
  const colors = ['#1F5E52','#C77B2E','#D99A2B','#3F7D63','#20261F'];
  for(let i=0;i<24;i++){
    const el = document.createElement('div');
    el.className='confetti-piece';
    el.style.left = (Math.random()*100)+'vw';
    el.style.background = colors[i%colors.length];
    el.style.animation = `confetti-fall ${0.9+Math.random()*0.7}s ease-in forwards`;
    el.style.animationDelay = (Math.random()*0.2)+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 2000);
  }
}

/* ---------------- notifications ---------------- */
function checkNotifications(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const todayISO = toISO(startOfToday());
  const day = state.cache[todayISO];
  if(!day) return;
  const now = new Date();
  const hhmm = pad(now.getHours())+':'+pad(now.getMinutes());
  day.items.forEach(it=>{
    if(it.time && it.time===hhmm && !it.done && !state.notifiedToday.has(it.id)){
      new Notification('یادآوری برنامه', {body: it.text});
      state.notifiedToday.add(it.id);
    }
  });
}

function formatRange(weekStart){
  const end = addDays(weekStart,6);
  const opt = {month:'short', day:'numeric'};
  return `${weekStart.toLocaleDateString('fa-IR-u-ca-gregory',opt)} تا ${end.toLocaleDateString('fa-IR-u-ca-gregory',opt)}`;
}

  document.querySelectorAll('[data-action="duration"]').forEach(el=> el.onchange = ()=> editItemDuration(state.activeDate, el.dataset.id, el.value));

  if(focusBtnEl) focusBtnEl.onclick = ()=> startFocusMode(state.activeDate);

/* ---------------- focus mode ---------------- */
function startFocusMode(iso){
  const items = state.cache[iso].items.filter(i=>!i.done);
  if(items.length===0) return;
  state.focusQueue = items.map(i=>i.id);
  state.focusIdx = 0;
  renderFocus(iso);
}
function renderFocus(iso){
  const existing = document.getElementById('focusOverlay');
  if(existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.className='focus-overlay'; overlay.id='focusOverlay';
  const remainingIds = state.focusQueue.filter(id=>{
    const it = state.cache[iso].items.find(x=>x.id===id);
    return it && !it.done;
  });
  state.focusQueue = remainingIds;
  if(remainingIds.length===0){
    overlay.innerHTML = `<button class="fo-close" id="focusClose">${ic.close()}</button><div class="fo-empty">🎉 همه‌چیز تمومه!</div>`;
    document.body.appendChild(overlay);
    document.getElementById('focusClose').onclick = ()=> overlay.remove();
    return;
  }
  if(state.focusIdx>=remainingIds.length) state.focusIdx=0;
  const currentId = remainingIds[state.focusIdx];
  const it = state.cache[iso].items.find(x=>x.id===currentId);
  overlay.innerHTML = `
    <button class="fo-close" id="focusClose">${ic.close()}</button>
    <div class="fo-progress">${state.focusIdx+1} از ${remainingIds.length}</div>
    <div class="fo-text">${escapeAttr(it.text)}</div>
    <div class="fo-actions">
      <button class="fo-skip" id="focusSkip">بعدی</button>
      <button class="fo-done" id="focusDone">انجام شد</button>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('focusClose').onclick = ()=>{ overlay.remove(); render(); };
  document.getElementById('focusSkip').onclick = ()=>{ state.focusIdx=(state.focusIdx+1)%remainingIds.length; renderFocus(iso); };
  document.getElementById('focusDone').onclick = async ()=>{
    await toggleItem(iso, currentId);
    renderFocus(iso);
  };
}

async function copyWeekPattern(weeks){
  const today = startOfToday();
  const weekStart = getWeekStart(today, state.weekOffset);
  for(let i=0;i<7;i++){
    if(state.settings.fixedWeekdays.includes(i)) continue;
    const sourceISO = toISO(addDays(weekStart,i));
    await ensureDayLoaded(sourceISO);
    const src = state.cache[sourceISO];
    if(!src || src.items.length===0) continue;
    for(let w=1; w<=weeks; w++){
      const targetISO = toISO(addDays(weekStart, i + w*7));
      await ensureDayLoaded(targetISO);
      state.cache[targetISO].items = src.items.map(it=>({id:uid(), text:it.text, done:false, priority:it.priority, time:it.time, tag:it.tag||null, duration:it.duration||null}));
      await saveDay(targetISO);
    }
  }
  render();
}

function statsHeatmapHTML(){
  const today = startOfToday();
  const start = addDays(today,-34);
  const cells = [];
  for(let i=0;i<35;i++){
    const iso = toISO(addDays(start,i));
    const day = state.cache[iso];
    let pct = null;
    if(day && day.items.length) pct = day.items.filter(x=>x.done).length/day.items.length;
    const bg = pct===null ? 'var(--paper)' : `color-mix(in srgb, var(--done) ${Math.round(15+pct*75)}%, var(--paper))`;
    cells.push(`<div class="heat-cell" style="background:${bg}" title="${iso}"></div>`);
  }
  return `
    <p class="sub">هر خانه یک روزه؛ رنگ پررنگ‌تر یعنی درصد تکمیل بیشتر (۵ هفته اخیر).</p>
    <div class="heat-labels">${WEEKDAYS_SHORT.map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="heatmap-grid">${cells.join('')}</div>
  `;
}

function statsTrendHTML(){
  const today = startOfToday();
  const days = 30;
  const points = [];
  for(let i=days-1;i>=0;i--){
    const iso = toISO(addDays(today,-i));
    const day = state.cache[iso];
    const pct = day && day.items.length ? Math.round(day.items.filter(x=>x.done).length/day.items.length*100) : null;
    points.push(pct);
  }
  const w=280, h=110, padY=10;
  const validPts = points.map((p,i)=>({p,i})).filter(o=>o.p!==null);
  let pathD = '';
  if(validPts.length>1){
    pathD = validPts.map((o,idx)=>{
      const x = (o.i/(days-1))*w;
      const y = padY + (100-o.p)/100*(h-padY*2);
      return `${idx===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
  }
  const dots = validPts.map(o=>{
    const x = (o.i/(days-1))*w;
    const y = padY + (100-o.p)/100*(h-padY*2);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.2" fill="var(--fixed)"/>`;
  }).join('');
  return `
    <p class="sub">درصد تکمیل روزانه در ۳۰ روز اخیر.</p>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:130px; overflow:visible;">
      <line x1="0" y1="${h-padY}" x2="${w}" y2="${h-padY}" stroke="var(--border)" stroke-width="1"/>
      ${pathD ? `<path d="${pathD}" fill="none" stroke="var(--fixed)" stroke-width="2.2"/>` : ''}
      ${dots}
    </svg>
  `;
}

function statsCompareHTML(){
  const today = startOfToday();
  function weekStats(offset){
    const ws = getWeekStart(today, offset);
    let done=0, total=0;
    for(let i=0;i<7;i++){
      const iso = toISO(addDays(ws,i));
      const day = state.cache[iso];
      if(day){ total += day.items.length; done += day.items.filter(x=>x.done).length; }
    }
    return {done, total, pct: total? Math.round(done/total*100):0, label: formatRange(ws)};
  }
  const thisWeek = weekStats(0);
  const lastWeek = weekStats(-1);
  return `
    <p class="sub">هفته‌ی جاری در برابر هفته‌ی قبل.</p>
    <div class="summary-row">
      <div class="sr-head"><span>این هفته (${thisWeek.label})</span><span>${thisWeek.done} از ${thisWeek.total}</span></div>
      <div class="summary-track"><i style="width:${thisWeek.pct}%; background:var(--fixed);"></i></div>
    </div>
    <div class="summary-row">
      <div class="sr-head"><span>هفته‌ی قبل (${lastWeek.label})</span><span>${lastWeek.done} از ${lastWeek.total}</span></div>
      <div class="summary-track"><i style="width:${lastWeek.pct}%; background:var(--variable);"></i></div>
    </div>
  `;
}

function statsInsightsHTML(){
  const sums = Array.from({length:7},()=>({done:0,total:0}));
  Object.keys(state.cache).forEach(iso=>{
    const day = state.cache[iso];
    if(!day || day.items.length===0) return;
    const dow = jsDowToPersianIndex(new Date(iso+'T00:00:00').getDay());
    sums[dow].total += day.items.length;
    sums[dow].done += day.items.filter(x=>x.done).length;
  });
  return `
    <p class="sub">میانگین درصد تکمیل به تفکیک روز هفته (۹۰ روز اخیر).</p>
    ${sums.map((s,i)=>{
      const pct = s.total? Math.round(s.done/s.total*100):0;
      return `<div class="insight-row">
        <span class="wd-label">${WEEKDAYS[i]}</span>
        <div class="track"><i style="width:${pct}%"></i></div>
        <span class="val">${s.total?pct+'%':'—'}</span>
      </div>`;
    }).join('')}
  `;
}

function statsHistoryHTML(filter){
  const today = startOfToday();
  const rows = [];
  for(let i=0;i<60;i++){
    const iso = toISO(addDays(today,-i));
    const day = state.cache[iso];
    if(!day || day.items.length===0) continue;
    const done = day.items.filter(x=>x.done).length, total = day.items.length;
    const complete = done===total;
    if(filter==='complete' && !complete) continue;
    if(filter==='incomplete' && complete) continue;
    rows.push({iso, done, total});
  }
  return `
    <div class="tabs" style="margin-bottom:12px;">
      <button class="tab-btn ${filter==='all'?'active':''}" data-hfilter="all">همه</button>
      <button class="tab-btn ${filter==='complete'?'active':''}" data-hfilter="complete">کامل‌شده</button>
      <button class="tab-btn ${filter==='incomplete'?'active':''}" data-hfilter="incomplete">ناقص</button>
    </div>
    <div class="history-list">
      ${rows.map(r=>{
        const d = new Date(r.iso+'T00:00:00');
        return `<div class="history-item" data-date="${r.iso}">
          <span class="h-date">${WEEKDAYS[jsDowToPersianIndex(d.getDay())]} ${d.toLocaleDateString('fa-IR-u-ca-gregory',{month:'short',day:'numeric'})}</span>
          <span class="h-stat">${r.done} از ${r.total}</span>
        </div>`;
      }).join('') || '<div class="empty-state"><p>چیزی برای نمایش نیست</p></div>'}
    </div>
  `;
}
function attachHistoryEvents(overlay){
  const body = document.getElementById('statsBody');
  body.querySelectorAll('[data-hfilter]').forEach(btn=>{
    btn.onclick = ()=>{ body.innerHTML = statsHistoryHTML(btn.dataset.hfilter); attachHistoryEvents(overlay); };
  });
  body.querySelectorAll('.history-item').forEach(el=>{
    el.onclick = async ()=>{
      const iso = el.dataset.date;
      const d = new Date(iso+'T00:00:00');
      const weeksDiff = Math.round((getWeekStart(d,0) - getWeekStart(startOfToday(),0)) / (7*86400000));
      state.weekOffset = weeksDiff;
      await loadRangeForWeek(state.weekOffset);
      await selectDay(iso);
      overlay.remove();
    };
  });
}

init();
</script>
</body>
</html>
